name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core (pure Kotlin) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run core unit + MockWebServer tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

  android-build:
    name: Android app build & unit tests (Whisper)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake for the native whisper.cpp build
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" >/dev/null

      - name: Fetch whisper.cpp source + model
        run: bash scripts/fetch-models.sh

      - name: Verify whisper source + model are present before build
        run: |
          test -f app/src/main/cpp/whisper/whisper.cpp
          test -f app/src/main/cpp/whisper/ggml.c
          test -f app/src/main/assets/whisper-model/ggml-small.en-q5_1.bin
          echo "Model size:"; du -sh app/src/main/assets/whisper-model

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify the native lib and model are packaged inside the APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libwhisper-jni.so" \
            && echo "✓ libwhisper-jni.so is bundled" \
            || (echo "✗ native lib missing from APK" && exit 1)
          unzip -l "$APK" | grep -q "assets/whisper-model/ggml-small.en-q5_1.bin" \
            && echo "✓ Whisper model is bundled" \
            || (echo "✗ Whisper model missing from APK" && exit 1)

      - name: Run app JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compile instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Rename APK for release
        if: github.event_name == 'push'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/britspeak-whisper-debug.apk

      - name: Publish Whisper APK to a separate GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: whisper-latest
          name: BritSpeak Whisper (experimental)
          body: |
            EXPERIMENTAL on-device Whisper speech-recognition build of BritSpeak.
            Separate app id (`...britspeak.whisper`, label "BritSpeak Whisper"), so it installs
            alongside the Vosk build for comparison. arm64 phones only.
            First launch unpacks a ~180 MB model — give it a few seconds.
          files: release/britspeak-whisper-debug.apk
          prerelease: true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: britspeak-whisper-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload app test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report
          path: app/build/reports/tests/testDebugUnitTest
