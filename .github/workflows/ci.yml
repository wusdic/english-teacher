name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core (pure Kotlin) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run core unit + MockWebServer tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

  android-build:
    name: Android app build & unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch offline speech models
        run: bash scripts/fetch-models.sh

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Run app JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compile instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Rename APK for release
        if: github.event_name == 'push'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/britspeak-debug.apk

      - name: Publish APK to a GitHub Release (direct download link)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: BritSpeak debug (latest)
          body: |
            Latest debug build of BritSpeak (auto-published by CI).
            Install `britspeak-debug.apk` on Android (allow "install unknown apps").
            Set your model provider + API key in Settings on first launch.
          files: release/britspeak-debug.apk
          prerelease: true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: britspeak-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload app test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report
          path: app/build/reports/tests/testDebugUnitTest

  ui-tests:
    name: Android UI tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumentation test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-report
          path: app/build/reports/androidTests/connected
